            schema:
              "$ref": "#/components/schemas/RolePermission"
            example:
              permission_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      responses:
        "201":
          description: Permission successfully assigned to role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RolePermission"
              example:
                role_id: "b2e3c4d5-e6f7-8901-bcde-f01234567890"
                permission_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        "400":
          description: Invalid or missing permission_id in request body
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Unauthorized – missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Forbidden – caller does not have admin role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: Role or Permission not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: Permission is already assigned to this role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
  "/admin/roles/{roleId}/permissions/{permissionId}":
    delete:
      tags:
        - admin
      operationId: removePermissionFromRole
      summary: Remove a permission from a role
      description: "Allowed roles: admin."
      parameters:
        - name: roleId
          in: path
          required: true
          schema:
            type: string
          description: UUID of the role from which the permission will be removed
        - name: permissionId
          in: path
          required: true
          schema:
            type: string
          description: UUID of the permission to remove from the role
      responses:
        "200":
          description: Permission removed from role successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageResponse"
              example:
                message: Permission removed from role successfully
        "401":
          description: Unauthorized – missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Forbidden – caller does not have admin role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: "Role or Permission not found, or permission is not assigned to the role"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
  "/admin/permissions":
    get:
      tags:
        - admin
      operationId: listPermissions
      summary: List all permissions
      description: "Allowed roles: admin."
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: Page number for pagination
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Number of permissions per page
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Filter permissions by name substring
      responses:
        "200":
          description: Paginated list of all permissions in the system
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Permission"
              example:
                data:
                  - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    name: "products:read"
                    description: Allows reading product catalog data
                  - id: "b2c3d4e5-f6a7-8901-bcde-f01234567891"
                    name: "products:write"
                    description: Allows creating and updating products
                  - id: "c3d4e5f6-a7b8-9012-cdef-012345678912"
                    name: "orders:manage"
                    description: Allows viewing and updating orders
                  - id: "d4e5f6a7-b8c9-0123-def0-123456789023"
                    name: "users:read"
                    description: Allows viewing user accounts
                meta:
                  page: 1
                  limit: 50
                  total: 4
                  total_pages: 1
        "401":
          description: Unauthorized – missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Forbidden – caller does not have admin role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
