openapi: 3.1.0
info:
  title: Vantage Commerce Platform API
  version: 1.0.0
  description: "REST + action sub-resources API for catalogue browsing, cart, checkout, orders, returns, payments, promotions, notifications, and admin management."
servers:
  - url: "https://api.vantage.example.com/v1"
tags:
  - name: auth
    description: "Registration, login, logout, password reset"
  - name: users
    description: User profile management
  - name: addresses
    description: Saved delivery addresses
  - name: catalogue
    description: "Products, SKUs, categories, brands, images"
  - name: search
    description: "Full-text search and autocomplete"
  - name: serviceability
    description: PIN code delivery serviceability check
  - name: cart
    description: Cart and cart item management
  - name: checkout
    description: "Multi-step checkout flow"
  - name: orders
    description: Order lifecycle and state transitions
  - name: returns
    description: Return request creation and review
  - name: payments
    description: Payment initiation and callbacks
  - name: refunds
    description: Refund records linked to orders
  - name: "promo-codes"
    description: Promo code management and validation
  - name: notifications
    description: "In-app notification centre"
  - name: admin
    description: "Admin reporting, user management, roles, serviceable PIN codes"
paths:
  "/auth/register":
    post:
      tags:
        - auth
      operationId: register
      summary: Register a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
            example:
              email: "jane.doe@example.com"
              password: "S3cur3P@ssw0rd!"
              full_name: Jane Doe
              phone: "+919876543210"
      responses:
        "201":
          description: Account created successfully; JWT returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhMWIyYzNkNC1lNWY2LTc4OTAtYWJjZC1lZjEyMzQ1Njc4OTAiLCJyb2xlIjoiY3VzdG9tZXIiLCJpYXQiOjE3MTAwMDAwMDAsImV4cCI6MTcxMDA4NjQwMH0.signature
                user:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  email: "jane.doe@example.com"
                  full_name: Jane Doe
                  phone: "+919876543210"
                  role_id: "role-uuid-customer"
                  is_active: true
                  created_at: "2024-03-15T10:00:00Z"
                  updated_at: "2024-03-15T10:00:00Z"
        "400":
          description: Validation error – missing or malformed fields
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: Email address is already registered
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: Password does not meet complexity requirements
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/auth/login":
    post:
      tags:
        - auth
      operationId: login
      summary: Authenticate and receive JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
            example:
              email: "jane.doe@example.com"
              password: "S3cur3P@ssw0rd!"
      responses:
        "200":
          description: Authentication successful; JWT returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhMWIyYzNkNC1lNWY2LTc4OTAtYWJjZC1lZjEyMzQ1Njc4OTAiLCJyb2xlIjoiY3VzdG9tZXIiLCJpYXQiOjE3MTAwMDAwMDAsImV4cCI6MTcxMDA4NjQwMH0.signature
                user:
                  id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  email: "jane.doe@example.com"
                  full_name: Jane Doe
                  phone: "+919876543210"
                  role_id: "role-uuid-customer"
                  is_active: true
                  created_at: "2024-01-10T08:30:00Z"
                  updated_at: "2024-03-15T10:00:00Z"
        "400":
          description: Validation error – missing or malformed fields
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Account is deactivated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/auth/logout":
    post:
      tags:
        - auth
      operationId: logout
      summary: Invalidate current session
      description: "Allowed roles: customer, staff, merchandiser, admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
        "200":
          description: Session invalidated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageResponse"
              example:
                message: Successfully logged out.
        "401":
          description: Missing or invalid authorization token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
  "/auth/forgot-password":
    post:
      tags:
        - auth
      operationId: forgotPassword
      summary: "Request a password-reset token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ForgotPasswordRequest"
            example:
              email: "jane.doe@example.com"
      responses:
        "200":
          description: Reset email dispatched if address exists (always returns 200 to prevent enumeration)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageResponse"
              example:
                message: "If that email address is registered, a password reset link has been sent."
        "400":
          description: Validation error – missing or invalid email format
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "429":
          description: Too many reset requests; rate limit exceeded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/auth/reset-password":
    post:
      tags:
        - auth
      operationId: resetPassword
      summary: Reset password using token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ResetPasswordRequest"
            example:
              token: "eyJhbGciOiJIUzI1NiJ9.reset-payload.signature"
              new_password: "N3wS3cur3P@ssw0rd!"
              confirm_password: "N3wS3cur3P@ssw0rd!"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageResponse"
              example:
                message: Your password has been reset successfully. Please log in with your new password.
        "400":
          description: Validation error – missing fields or passwords do not match
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Reset token is invalid or has expired
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: New password does not meet complexity requirements
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/auth/guest-register":
    post:
      tags:
        - auth
      operationId: guestRegister
      summary: "Convert guest to registered account post-checkout"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GuestRegisterPromptRequest"
            example:
              guest_email: "guest.shopper@example.com"
              order_id: "ord-uuid-7890abcd-ef12-3456-7890-abcdef123456"
              password: "G3st2R3g!Pass"
              full_name: Guest Shopper
              phone: "+919812345678"
      responses:
        "201":
          description: Guest account converted to registered account; JWT returned
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJiMmMzZDRlNS1mNmE3LTg5MDEtYmNkZS1mMDEyMzQ1Njc4OTEiLCJyb2xlIjoiY3VzdG9tZXIiLCJpYXQiOjE3MTAwMDAwMDAsImV4cCI6MTcxMDA4NjQwMH0.signature
                user:
                  id: "b2c3d4e5-f6a7-8901-bcde-f01234567891"
                  email: "guest.shopper@example.com"
                  full_name: Guest Shopper
                  phone: "+919812345678"
                  role_id: "role-uuid-customer"
                  is_active: true
                  created_at: "2024-03-15T12:00:00Z"
                  updated_at: "2024-03-15T12:00:00Z"
        "400":
          description: Validation error – missing or malformed fields
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: No guest session found for the provided email and order combination
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "409":
          description: Email address is already associated with a registered account
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: Password does not meet complexity requirements
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security: []
  "/users/me":
    get:
      tags:
        - users
      operationId: getMe
      summary: Get current user profile
      description: "Allowed roles: customer, staff, merchandiser, admin."
      responses:
        "200":
          description: Current authenticated user profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                email: "jane.doe@example.com"
                full_name: Jane Doe
                phone: "+919876543210"
                role_id: "role-uuid-customer-0001"
                is_active: true
                created_at: "2024-01-15T10:30:00Z"
                updated_at: "2024-06-01T08:00:00Z"
        "401":
          description: Unauthorized – missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
    patch:
      tags:
        - users
      operationId: updateMe
      summary: Update current user profile
      description: "Allowed roles: customer, staff, merchandiser, admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateUserRequest"
            example:
              full_name: Jane M. Doe
              phone: "+919876543211"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                email: "jane.doe@example.com"
                full_name: Jane M. Doe
                phone: "+919876543211"
                role_id: "role-uuid-customer-0001"
                is_active: true
                created_at: "2024-01-15T10:30:00Z"
                updated_at: "2024-06-10T12:00:00Z"
        "400":
          description: Validation error – invalid field values
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Unauthorized – missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
  "/users/me/change-password":
    post:
      tags:
        - users
      operationId: changePassword
      summary: Change authenticated user password
      description: "Allowed roles: customer, staff, merchandiser, admin."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ChangePasswordRequest"
            example:
              current_password: "OldP@ssw0rd!"
              new_password: "NewS3cur3P@ss!"
              confirm_new_password: "NewS3cur3P@ss!"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageResponse"
              example:
                message: Password changed successfully.
        "400":
          description: Validation error – passwords do not match or new password too weak
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Unauthorized – current password is incorrect or token invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
  "/users":
    get:
      tags:
        - users
      operationId: listUsers
      summary: List all users (admin)
      description: "Allowed roles: admin."
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
          description: "Page number (1-based)"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Number of results per page (max 100)
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search by email or full name
        - name: role_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filter by role UUID
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by active status
      responses:
        "200":
          description: Paginated list of users
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Pagination"
              example:
                data:
                  - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    email: "jane.doe@example.com"
                    full_name: Jane Doe
                    phone: "+919876543210"
                    role_id: "role-uuid-customer-0001"
                    is_active: true
                    created_at: "2024-01-15T10:30:00Z"
                    updated_at: "2024-06-01T08:00:00Z"
                  - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                    email: "john.smith@example.com"
                    full_name: John Smith
                    phone: "+919876500001"
                    role_id: "role-uuid-customer-0001"
                    is_active: true
                    created_at: "2024-02-20T09:15:00Z"
                    updated_at: "2024-05-28T14:30:00Z"
                meta:
                  page: 1
                  limit: 20
                  total: 142
                  total_pages: 8
        "401":
          description: Unauthorized – missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Forbidden – caller does not have admin role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
  "/users/{userId}":
    get:
      tags:
        - users
      operationId: getUser
      summary: Get user by ID (admin)
      description: "Allowed roles: admin."
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the user to retrieve
      responses:
        "200":
          description: User record for the given ID
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                email: "jane.doe@example.com"
                full_name: Jane Doe
                phone: "+919876543210"
                role_id: "role-uuid-customer-0001"
                is_active: true
                created_at: "2024-01-15T10:30:00Z"
                updated_at: "2024-06-01T08:00:00Z"
        "401":
          description: Unauthorized – missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Forbidden – caller does not have admin role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
    patch:
      tags:
        - users
      operationId: updateUser
      summary: Update user by ID (admin)
      description: "Allowed roles: admin."
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the user to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateUserRequest"
            example:
              full_name: Jane Updated Doe
              phone: "+919800000001"
              role_id: "role-uuid-staff-00002"
              is_active: true
      responses:
        "200":
          description: Updated user record
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                email: "jane.doe@example.com"
                full_name: Jane Updated Doe
                phone: "+919800000001"
                role_id: "role-uuid-staff-00002"
                is_active: true
                created_at: "2024-01-15T10:30:00Z"
                updated_at: "2024-06-15T09:45:00Z"
        "400":
          description: Validation error – invalid field values
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Unauthorized – missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Forbidden – caller does not have admin role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
    delete:
      tags:
        - users
      operationId: deleteUser
      summary: Deactivate user (admin)
      description: "Allowed roles: admin."
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the user to deactivate
      responses:
        "200":
          description: User deactivated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MessageResponse"
              example:
                message: "User a1b2c3d4-e5f6-7890-abcd-ef1234567890 has been deactivated."
        "401":
          description: Unauthorized – missing or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Forbidden – caller does not have admin role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
  "/users/me/addresses":
    get:
      tags:
        - addresses
      operationId: listAddresses
      summary: List saved addresses for current user
      description: "Allowed roles: customer."
      responses:
        "200":
          description: Array of saved addresses for the authenticated user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Address"
              example:
                - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                  user_id: "u1b2c3d4-e5f6-7890-abcd-ef1234567891"
                  full_name: Riya Sharma
                  line1: "42, MG Road"
                  line2: Near City Mall
                  city: Bengaluru
                  state: Karnataka
                  pin_code: "560001"
                  country: India
                  phone: "+919876543210"
                  is_default: true
                  created_at: "2024-03-01T10:00:00Z"
                  updated_at: "2024-03-01T10:00:00Z"
                - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                  user_id: "u1b2c3d4-e5f6-7890-abcd-ef1234567891"
                  full_name: Riya Sharma
                  line1: "12, Koramangala 5th Block"
                  line2: null
                  city: Bengaluru
                  state: Karnataka
                  pin_code: "560095"
                  country: India
                  phone: "+919876543210"
                  is_default: false
                  created_at: "2024-04-15T08:30:00Z"
                  updated_at: "2024-04-15T08:30:00Z"
        "401":
          description: Unauthorized – missing or invalid authentication token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Forbidden – caller does not have the customer role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
    post:
      tags:
        - addresses
      operationId: createAddress
      summary: Add a new address
      description: "Allowed roles: customer."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateAddressRequest"
            example:
              full_name: Riya Sharma
              line1: "88, Indiranagar 12th Main"
              line2: Apartment 4B
              city: Bengaluru
              state: Karnataka
              pin_code: "560038"
              country: India
              phone: "+919876543210"
              is_default: false
      responses:
        "201":
          description: Newly created address
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Address"
              example:
                id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                user_id: "u1b2c3d4-e5f6-7890-abcd-ef1234567891"
                full_name: Riya Sharma
                line1: "88, Indiranagar 12th Main"
                line2: Apartment 4B
                city: Bengaluru
                state: Karnataka
                pin_code: "560038"
                country: India
                phone: "+919876543210"
                is_default: false
                created_at: "2024-06-01T12:00:00Z"
                updated_at: "2024-06-01T12:00:00Z"
        "400":
          description: "Bad request – validation failed (e.g. missing required fields, invalid pin_code format)"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          description: Unauthorized – missing or invalid authentication token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "403":
          description: Forbidden – caller does not have the customer role
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        "422":
          description: Unprocessable entity – pin code not serviceable or business rule violation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      security:
        - bearerAuth: []
  "/users/me/addresses/{addressId}":
    get:
      tags:
        - addresses
      operationId: getAddress
      summary: Get a saved address
      description: "Allowed roles: customer."
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique identifier of the address
      responses:
        "200":
          description: The requested address
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Address"
              example:
                id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                user_id: "u1b2c3d4-e5f6-7890-abcd-ef1234567891"
                full_name: Riya Sharma
